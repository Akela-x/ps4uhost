<!DOCTYPE html>
<html>
<head>
    <title>PS4 - Exploit Host</title>
    <link rel="stylesheet" href="../style.css">

    <style>
        /* ===== DARK GLASS STYLE ===== */

        html {
            background: linear-gradient(135deg, #080a12, #10121d, #151827) !important;
            background-attachment: fixed !important;
            min-height: 100vh;
            color: #f0f0f0;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background: transparent !important;
            font-family: 'Rajdhani', sans-serif;
        }

        .container {
            width: 90%;
            max-width: 670px;
            box-sizing: border-box;
            padding: 42px 28px 38px;

            background: rgba(30, 32, 45, 0.72) !important;

            border: 1px solid rgba(180, 185, 205, 0.18) !important;
            border-radius: 30px;

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            text-align: center;
        }

        /* ===== MAIN TITLE ===== */

        .main-title {
            margin: 0;
            padding: 0;

            font-family: 'Orbitron', sans-serif;
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1.4;

            letter-spacing: 3px;
            text-transform: uppercase;

            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.65);
        }

        /* ===== MUSTAFA ===== */

        .name-mustafa {
            display: block;

            font-size: 3rem;
            font-weight: 900;

            background: linear-gradient(
                90deg,
                #4f9cff,
                #78b5ff,
                #4f9cff,
                #a8d0ff,
                #4f9cff
            );

            background-size: 200% auto;

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            animation: blueShine 3s linear infinite;

            filter: drop-shadow(
                0 0 18px rgba(79, 156, 255, 0.25)
            );

            letter-spacing: 5px;
        }

        @keyframes blueShine {
            to {
                background-position: 200% center;
            }
        }

        /* ===== PS4 ===== */

        .ps4-title {
            display: inline-block;

            font-size: 2rem;
            font-weight: 700;

            color: #4f9cff;

            text-shadow:
                0 0 12px rgba(79, 156, 255, 0.45),
                0 0 25px rgba(79, 156, 255, 0.18);

            margin: 10px;

            letter-spacing: 4px;
        }

        /* ===== PS5 ===== */

        .ps5-title {
            display: inline-block;

            font-size: 2rem;
            font-weight: 700;

            color: #aeb4c2;

            text-shadow:
                0 0 12px rgba(190, 195, 210, 0.28),
                0 0 25px rgba(190, 195, 210, 0.12);

            margin: 10px;

            letter-spacing: 4px;
        }

        /* ===== SUBTITLE ===== */

        .subtitle {
            font-family: 'Rajdhani', sans-serif;

            font-size: 1.2rem;
            font-weight: 600;

            color: #9296a4;

            letter-spacing: 6px;
            text-transform: uppercase;

            margin-bottom: 15px;
        }

        /* ===== VERSION ===== */

        .version-badge {
            display: inline-block;

            padding: 8px 25px;

            background: linear-gradient(
                135deg,
                #263b5d,
                #17263d
            );

            color: #66a8ff;

            border: 1px solid rgba(79, 156, 255, 0.35);
            border-radius: 30px;

            font-family: 'Orbitron', sans-serif;

            font-size: 1rem;
            font-weight: 800;

            letter-spacing: 2px;
            text-transform: uppercase;

            margin: 15px 0 25px;

            box-shadow:
                0 5px 20px rgba(30, 100, 190, 0.18),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        /* ===== SEPARATOR ===== */

        .separator {
            border: none;

            height: 1px;

            width: 90%;

            margin: 20px auto;

            background: linear-gradient(
                to right,
                transparent,
                rgba(130, 140, 165, 0.22),
                transparent
            );
        }

        /* ===== STATUS ===== */

        .status-bar {
            margin: 25px auto 30px;

            padding: 18px 20px;

            width: 85%;
            box-sizing: border-box;

            background: rgba(12, 14, 22, 0.45);

            border: 1px solid rgba(180, 185, 205, 0.12);
            border-radius: 16px;

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.03),
                0 10px 25px rgba(0, 0, 0, 0.18);

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .status-text {
            display: block;

            font-family: 'Rajdhani', sans-serif;

            font-size: 1.15rem;
            font-weight: 600;

            color: #aeb4c2;

            line-height: 1.4;

            text-shadow:
                0 1px 4px rgba(0, 0, 0, 0.5);
        }

        .status-text.loading {
            color: #8e96a8;
        }

        .status-text.error {
            color: #d5d8df;
        }

        /* ===== FOOTER ===== */

        footer {
            margin-top: 32px;

            padding-top: 25px;

            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        .credit {
            font-family: 'Rajdhani', sans-serif;

            font-size: 1.1rem;
            font-weight: 500;

            margin: 0 0 5px;

            color: #777b8b;
        }

        .credit-link {
            background: linear-gradient(
                90deg,
                #4f9cff,
                #78b5ff
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;

            text-decoration: none;

            font-weight: 800;
            font-size: 1.3rem;
        }

        .thanks {
            font-family: 'Rajdhani', sans-serif;

            font-size: 0.95rem;

            color: #555967;

            margin-top: 10px;

            letter-spacing: 1px;
        }

        /* ===== MOBILE ===== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .container {
                width: 94%;
                padding: 35px 18px 32px;
                border-radius: 24px;
            }

            .main-title {
                font-size: 1.8rem;
            }

            .name-mustafa {
                font-size: 2.5rem;
            }

            .ps4-title,
            .ps5-title {
                font-size: 1.6rem;
            }

            .subtitle {
                font-size: 1rem;
                letter-spacing: 4px;
            }

            .status-bar {
                width: 92%;
                padding: 16px 12px;
            }

            .status-text {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 class="main-title">
                <span class="name-mustafa">ВЗЛОМ</span>
                <span class="ps4-title">PS4</span>
            </h1>
            <div class="subtitle">Exploit Host</div>
            <div class="version-badge">FW 7.00 - 13.00</div>
        </header>
        
        <hr class="separator">

        <div class="status-bar">
            <span id="msgs" class="status-text loading">⏳ Loading GoldHEN v2.4b18.10... Please Wait</span>
        </div>
        
        <footer>
            <p class="credit">Designed by <a href="#" class="credit-link">Mustafa</a></p>
            <p class="thanks">❤️ Special thanks to all scene developers</p>
        </footer>
    </div>

    <script>
        // ======== نفس المنطق البرمجي الأصلي تماماً ========
        var uaFull = navigator.userAgent;
        var match = uaFull.match(/PlayStation 4[ /]([\d.]+)/i);
        var isPS4 = match !== null;
        var fwVersion = isPS4 ? match[1] : "Unknown";
        var fwNum = parseFloat(fwVersion);

        var msgs = document.getElementById('msgs');

        function onScriptError() {
            msgs.innerHTML = "Content not Found! - Clear Browser Data and Re-Install Cache ...";
        }

        if (!isPS4) {
            document.addEventListener("DOMContentLoaded", () => {
                msgs.innerHTML = "Only for PS4 with Firmware 7.00 to 13.00";
                msgs.className = "status-text error";
            });
        } else {
            if (window.applicationCache.status == '0') {
                if (fwNum >= 7.00 && fwNum <= 8.52) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cache700.html");
                    }, 500);
                } else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cache900.html");
                    }, 500);
                } else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cachecss.html");
                    }, 500);
                } else if (fwNum >= 11.50 && fwNum <= 13.00) {
                    msgs.innerHTML = "Installing Cache for FW " + fwVersion + "...";
                    setTimeout(function() {
                        window.location.replace("cacheslopkit.html");
                    }, 500);
                } else {
                    document.addEventListener("DOMContentLoaded", () => {
                        msgs.innerHTML = 'Unsupported Firmware: <span style="color: red;">' + fwVersion + '</span>';
                        msgs.className = "status-text error";
                    });
                }
            } else {
                // التحميل التلقائي للـ exploit - بدون أي أزرار
                if (fwNum >= 7.00 && fwNum <= 8.52) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "700/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 9.00 && fwNum <= 9.60) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "900/alert.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 10.00 && fwNum <= 11.02) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.src = "css/main.js";
                    script.onerror = onScriptError;
                    script.onload = function () {
                        setTimeout(function () {
                            doJb();
                        }, 500);
                    };
                    document.head.appendChild(script);
                }
                else if (fwNum >= 11.50 && fwNum <= 12.02) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_lapse.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
                else if (fwNum >= 12.50 && fwNum <= 13.00) {
                    msgs.innerHTML = "Loading Exploit for FW " + fwVersion + "...";
                    var script = document.createElement('script');
                    script.type = 'module';
                    script.src = "slopkit/chain_poops.js";
                    script.onerror = onScriptError;
                    document.head.appendChild(script);
                }
            }
        }
    </script>
</body>
</html>
