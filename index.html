<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PS4 - Exploit Host</title>
    <link rel="stylesheet" href="style.css">

    <style>
        /* ===== ОСНОВНОЙ ФОН ===== */

        html {
            background: linear-gradient(135deg, #080a12, #10121d, #151827) !important;
            background-attachment: fixed !important;
            min-height: 100vh;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            background: transparent !important;
        }


        /* ===== ЦЕНТРАЛЬНАЯ СТЕКЛЯННАЯ КАРТОЧКА ===== */

        #menu {
            display: block !important;
            width: 90%;
            max-width: 670px;
            box-sizing: border-box;

            padding: 42px 28px 38px;

            background: rgba(30, 32, 45, 0.72) !important;

            border: 1px solid rgba(180, 185, 205, 0.18) !important;
            border-radius: 30px;

            box-shadow:
                0 25px 60px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            text-align: center;
        }


        /* ===== ЗАГОЛОВОК ===== */

        #menu > h1:first-child {
            margin: 0 0 30px !important;

            font-family: 'Orbitron', sans-serif;

            font-size: 22px !important;
            font-weight: 700;

            letter-spacing: 1px;

            color: #4f9cff !important;

            text-shadow:
                0 0 12px rgba(79, 156, 255, 0.25);
        }


        /* ===== КНОПКА ===== */

        #menu .btn {
            display: block;

            width: 90% !important;
            max-width: 400px;

            height: 60px !important;

            margin: 0 auto !important;

            border: 1px solid rgba(255, 255, 255, 0.04) !important;
            border-radius: 16px;

            background: linear-gradient(
                145deg,
                #20222d,
                #111219
            ) !important;

            color: #f0f0f0 !important;

            font-family: 'Rajdhani', sans-serif;
            font-size: 20px !important;
            font-weight: 700 !important;

            letter-spacing: 1px;

            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }

        #menu .btn:hover {
            background: linear-gradient(
                145deg,
                #286bc0,
                #174477
            ) !important;

            transform: translateY(-2px);

            box-shadow:
                0 12px 30px rgba(30, 110, 220, 0.25);
        }

        #menu .btn:active {
            transform: translateY(0);

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.4);
        }


        /* ===== НИЖНИЙ ТЕКСТ ===== */

        #menu > h1:last-child {
            margin: 40px 0 0 !important;

            padding-top: 32px;

            border-top: 1px solid rgba(255, 255, 255, 0.07);

            font-family: 'Rajdhani', sans-serif;

            font-size: 16px !important;
            font-weight: 500;

            line-height: 1.5;

            color: #777b8b !important;

            text-shadow: none;
        }

        #menu > h1:last-child span {
            display: inline-block;

            margin-top: 8px;

            color: #555967 !important;

            font-size: 14px !important;
        }


        /* ===== МОБИЛЬНЫЕ УСТРОЙСТВА ===== */

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            #menu {
                width: 94%;
                padding: 35px 18px 32px;
                border-radius: 24px;
            }

            #menu > h1:first-child {
                font-size: 21px !important;
            }

            #menu .btn {
                width: 90% !important;
                height: 58px !important;
            }

            #menu > h1:last-child {
                font-size: 14px !important;
            }
        }
    </style>
</head>

<body>
    <div id="menu">

        <h1 style="font-size: 22px; color: #f0f0f0; margin-bottom: 30px;">
            PS4 WebKit Хост
        </h1>

        <!-- Только одна кнопка — путь изменён на ran -->
        <button class="btn"
                onclick="location.replace('ran/index.html')"
                style="width: 90%; max-width: 400px; font-size: 20px; height: 60px; background: linear-gradient(145deg, #0a0a0a, #1a1a1a, #2a2a2a); color: #f0f0f0; font-weight: 800; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);">
            Взломать
        </button>

        <h1 style="margin-top: 40px; font-size: 16px; color: #d0d0d0;">
            Специально для 4PDA Sony PlayStation 4 - Взлом
            <br>
            <span style="color: #888; font-size: 14px;">
                Особая благодарность всем разработчикам сцены
            </span>
        </h1>

    </div>
</body>
</html>
